name: Validate SparkBot touch

on:
  push:
    branches: [feat/sparkbot-touch-conversation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 libcjson-dev libmbedtls-dev pkg-config
      - run: python -m pip install pillow numpy packaging
      - run: python -m unittest discover -s scripts/tests -v
        env:
          CXX: g++-14
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: espressif/esp-sparkbot
            variant: esp-sparkbot
          - board: espressif/esp-sparkbot
            variant: esp-sparkbot-touch
          - board: surfer-c3-1.14tft
            variant: surfer-c3-1.14tft
    container:
      image: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build SparkBot variant
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python scripts/build.py "${{ matrix.board }}" --name "${{ matrix.variant }}" --language zh-CN --zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-firmware
          path: |
            releases/*.zip
            build/xiaozhi.bin
            build/flasher_args.json
            build/partition_table/partition-table.bin
